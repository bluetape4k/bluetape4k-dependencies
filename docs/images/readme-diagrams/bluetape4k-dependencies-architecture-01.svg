<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">bluetape4k-dependencies architecture</title>
  <desc id="desc">Static architecture map for the BOM, Gradle version catalog, publishing path, and consumer usage contracts.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="secondary" data-tip-direction="positive-x">
      <path d="M 1 1 L 12 7 L 1 13 Z" fill="#2F6DB5" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="secondary" data-tip-direction="positive-x">
      <path d="M 1 1 L 12 7 L 1 13 Z" fill="#2E8B57" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="secondary" data-tip-direction="positive-x">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#65758A" stroke-dasharray="none"/>
    </marker>
    <style>
      .canvas{fill:#F6F9FC}
      .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:42px;fill:#1D2E43;font-weight:400}
      .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:16px;fill:#586A7F;font-weight:400}
      .section{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;fill:#23384F;font-weight:400}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:22px;fill:#1D2E43;font-weight:400}
      .label{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:14px;fill:#33465D;font-weight:400}
      .small{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:12px;fill:#607186;font-weight:400}
      .tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:11px;fill:#607186;font-weight:400}
      .lane{stroke-width:2;filter:url(#shadow)}
      .card{stroke-width:2;filter:url(#shadow)}
      .pill{stroke-width:1.5}
      .connectorBlue{stroke:#2F6DB5;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-blue)}
      .connectorGreen{stroke:#2E8B57;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-green)}
      .connectorSlate{stroke:#65758A;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-slate)}
      .connectorDotted{stroke:#65758A;stroke-width:2.2;fill:none;stroke-dasharray:7 7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-slate)}
    </style>
  </defs>

  <rect class="canvas" width="1400" height="920"/>
  <rect class="frame" x="34" y="28" width="1332" height="864" rx="26"/>

  <text class="title" x="72" y="84">bluetape4k-dependencies architecture</text>
  <text class="subtitle" x="76" y="116">One repository publishes the BOM contract and also supplies the checked-out Gradle catalog used by producers.</text>

  <g transform="translate(70,156)">
    <rect class="lane" x="0" y="0" width="338" height="566" rx="22" fill="#EAF3FF" stroke="#74A7E8"/>
    <text class="section" x="30" y="42">Source of truth</text>
    <g transform="translate(38,82)">
      <rect class="card" x="0" y="0" width="262" height="132" rx="16" fill="#FFFFFF" stroke="#3E7EC8"/>
      <text class="cardTitle" x="131" y="38" text-anchor="middle">gradle/libs.versions.toml</text>
      <text class="label" x="131" y="70" text-anchor="middle">versions, plugins, libraries</text>
      <text class="label" x="131" y="96" text-anchor="middle">and bluetape4k coordinates</text>
    </g>
    <g transform="translate(38,252)">
      <rect class="card" x="0" y="0" width="262" height="106" rx="15" fill="#F7FBFF" stroke="#74A7E8"/>
      <text class="cardTitle" x="131" y="35" text-anchor="middle">Governance scripts</text>
      <text class="label" x="131" y="66" text-anchor="middle">sync managed catalog aliases</text>
      <text class="small" x="131" y="88" text-anchor="middle">keep generated sections bounded</text>
    </g>
    <g transform="translate(38,398)">
      <rect class="card" x="0" y="0" width="262" height="108" rx="15" fill="#F7FBFF" stroke="#74A7E8"/>
      <text class="cardTitle" x="131" y="35" text-anchor="middle">Release train input</text>
      <text class="label" x="131" y="66" text-anchor="middle">date-tagged catalog ref</text>
      <text class="small" x="131" y="88" text-anchor="middle">separate from BOM artifact version</text>
    </g>
  </g>

  <g transform="translate(520,166)">
    <rect class="card" x="0" y="0" width="364" height="174" rx="18" fill="#EEF8F1" stroke="#58A978"/>
    <text class="cardTitle" x="182" y="42" text-anchor="middle">java-platform BOM publication</text>
    <text class="label" x="182" y="76" text-anchor="middle">bluetape4k-dependencies artifact</text>
    <text class="label" x="182" y="102" text-anchor="middle">imports sub-BOM platforms</text>
    <text class="small" x="182" y="128" text-anchor="middle">projects, aws, image, text, graph</text>
    <text class="small" x="182" y="152" text-anchor="middle">leader, exposed, javers</text>
  </g>

  <g transform="translate(528,454)">
    <rect class="card" x="0" y="0" width="348" height="174" rx="18" fill="#FFF6DF" stroke="#D6A441"/>
    <text class="cardTitle" x="174" y="42" text-anchor="middle">Gradle catalog checkout</text>
    <text class="label" x="174" y="76" text-anchor="middle">shared authoring vocabulary</text>
    <text class="label" x="174" y="102" text-anchor="middle">plugin aliases and coordinates</text>
    <text class="small" x="174" y="130" text-anchor="middle">does not replace dependency resolution</text>
  </g>

  <g transform="translate(994,150)">
    <rect class="card" x="0" y="0" width="294" height="130" rx="18" fill="#F0F8EA" stroke="#88AB4A"/>
    <text class="cardTitle" x="147" y="39" text-anchor="middle">Library repositories</text>
    <text class="label" x="147" y="73" text-anchor="middle">publish their own sub-BOMs</text>
    <text class="small" x="147" y="99" text-anchor="middle">independent release cadence</text>
  </g>

  <g transform="translate(1010,336)">
    <rect class="card" x="0" y="0" width="278" height="144" rx="18" fill="#FDEEF2" stroke="#D86B83"/>
    <text class="cardTitle" x="139" y="40" text-anchor="middle">Workshop and apps</text>
    <text class="label" x="139" y="76" text-anchor="middle">consume published BOM only</text>
    <text class="small" x="139" y="104" text-anchor="middle">do not chase catalog alias bumps</text>
  </g>

  <g transform="translate(994,548)">
    <rect class="card" x="0" y="0" width="294" height="138" rx="18" fill="#EBF7F6" stroke="#45A7A1"/>
    <text class="cardTitle" x="147" y="40" text-anchor="middle">Internal builds</text>
    <text class="label" x="147" y="76" text-anchor="middle">read the checked-out catalog</text>
    <text class="small" x="147" y="104" text-anchor="middle">same names, explicit repo ref</text>
  </g>

  <g transform="translate(430,740)">
    <rect class="pill" x="0" y="0" width="660" height="78" rx="18" fill="#F8FAFC" stroke="#C9D6E2"/>
    <text class="label" x="330" y="25" text-anchor="middle">Contract split: BOM aligns resolved versions.</text>
    <text class="label" x="330" y="47" text-anchor="middle">Catalog helps Gradle authors write consistent builds.</text>
    <text class="tiny" x="330" y="67" text-anchor="middle">Consumers import the artifact version. Producers may pin a date-tagged catalog checkout.</text>
  </g>

  <path class="connector connectorBlue" d="M 370 300 H 448 Q 468 300 468 280 V 274 Q 468 254 488 254 H 520"/>
  <path class="connector connectorGreen" d="M 370 324 H 442 Q 462 324 462 344 V 516 Q 462 536 482 536 H 528"/>
  <path class="connector connectorSlate" d="M 884 254 H 944 Q 964 254 964 234 V 215 Q 964 195 984 195 H 994"/>
  <path class="connector connectorBlue" d="M 884 292 H 936 Q 956 292 956 352 V 408 Q 956 428 976 428 H 1010"/>
  <path class="connector connectorGreen" d="M 876 536 H 936 Q 956 536 956 597 Q 956 617 976 617 H 994"/>

  <g transform="translate(440,632)">
    <rect class="pill" x="0" y="0" width="506" height="48" rx="16" fill="#FFFFFF" stroke="#C9D6E2"/>
    <circle cx="28" cy="24" r="8" fill="#2F6DB5"/>
    <text class="small" x="48" y="21">published dependency contract</text>
    <circle cx="304" cy="24" r="8" fill="#2E8B57"/>
    <text class="small" x="324" y="21">authoring catalog contract</text>
  </g>
</svg>
