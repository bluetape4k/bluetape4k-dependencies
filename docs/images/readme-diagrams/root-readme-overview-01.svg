<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Bluetape4k Dependencies overview</title>
  <desc id="desc">Overview of the source catalog, BOM alignment surface, published artifact, and checked-out catalog usage.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 12 7 L 1 13 Z" fill="#2F6DB5"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 12 7 L 1 13 Z" fill="#2E8B57"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#65758A"/>
    </marker>
    <style>
      .canvas{fill:#F6F9FC}
      .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:42px;fill:#1D2E43;font-weight:400}
      .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:16px;fill:#586A7F;font-weight:400}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:24px;fill:#1D2E43;font-weight:400}
      .metric{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:30px;fill:#1D2E43;font-weight:400}
      .label{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:14px;fill:#33465D;font-weight:400}
      .small{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:12px;fill:#607186;font-weight:400}
      .tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:11px;fill:#607186;font-weight:400}
      .card{stroke-width:2;filter:url(#shadow)}
      .pill{stroke-width:1.5}
      .connectorBlue{stroke:#2F6DB5;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-blue)}
      .connectorGreen{stroke:#2E8B57;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-green)}
      .connectorSlate{stroke:#65758A;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-slate)}
    </style>
  </defs>

  <rect class="canvas" width="1400" height="760"/>
  <rect class="frame" x="36" y="28" width="1328" height="704" rx="26"/>

  <text class="title" x="72" y="84">Bluetape4k Dependencies overview</text>
  <text class="subtitle" x="76" y="116">A single source catalog feeds the BOM artifact and the shared Gradle authoring vocabulary.</text>

  <g transform="translate(84,164)">
    <rect class="card" x="0" y="0" width="330" height="396" rx="20" fill="#EAF3FF" stroke="#74A7E8"/>
    <text class="cardTitle" x="165" y="44" text-anchor="middle">Source catalog</text>
    <text class="label" x="165" y="78" text-anchor="middle">gradle/libs.versions.toml</text>
    <g transform="translate(42,118)">
      <rect class="pill" x="0" y="0" width="246" height="58" rx="14" fill="#FFFFFF" stroke="#C9D6E2"/>
      <text class="metric" x="74" y="38" text-anchor="middle">95</text>
      <text class="label" x="166" y="34" text-anchor="middle">versions</text>
    </g>
    <g transform="translate(42,190)">
      <rect class="pill" x="0" y="0" width="246" height="58" rx="14" fill="#FFFFFF" stroke="#C9D6E2"/>
      <text class="metric" x="74" y="38" text-anchor="middle">7</text>
      <text class="label" x="166" y="34" text-anchor="middle">plugins</text>
    </g>
    <g transform="translate(42,262)">
      <rect class="pill" x="0" y="0" width="246" height="58" rx="14" fill="#FFFFFF" stroke="#C9D6E2"/>
      <text class="metric" x="74" y="38" text-anchor="middle">246</text>
      <text class="label" x="166" y="34" text-anchor="middle">libraries</text>
    </g>
    <text class="small" x="165" y="356" text-anchor="middle">names, aliases, and versions stay together</text>
  </g>

  <g transform="translate(530,190)">
    <rect class="card" x="0" y="0" width="344" height="318" rx="24" fill="#EEF8F1" stroke="#58A978"/>
    <text class="cardTitle" x="172" y="46" text-anchor="middle">Alignment surface</text>
    <text class="label" x="172" y="82" text-anchor="middle">java-platform + publishing</text>
    <g transform="translate(42,122)">
      <rect class="pill" x="0" y="0" width="260" height="64" rx="16" fill="#FFFFFF" stroke="#C9D6E2"/>
      <text class="metric" x="78" y="42" text-anchor="middle">17</text>
      <text class="label" x="180" y="30" text-anchor="middle">platform imports</text>
      <text class="tiny" x="180" y="49" text-anchor="middle">sub-BOMs and upstream BOMs</text>
    </g>
    <g transform="translate(42,204)">
      <rect class="pill" x="0" y="0" width="260" height="64" rx="16" fill="#FFFFFF" stroke="#C9D6E2"/>
      <text class="metric" x="78" y="42" text-anchor="middle">58</text>
      <text class="label" x="180" y="30" text-anchor="middle">direct constraints</text>
      <text class="tiny" x="180" y="49" text-anchor="middle">external managed modules</text>
    </g>
  </g>

  <g transform="translate(998,150)">
    <rect class="card" x="0" y="0" width="292" height="150" rx="20" fill="#FDEEF2" stroke="#D86B83"/>
    <text class="cardTitle" x="146" y="42" text-anchor="middle">Published BOM</text>
    <text class="label" x="146" y="78" text-anchor="middle">io.github.bluetape4k</text>
    <text class="label" x="146" y="104" text-anchor="middle">bluetape4k-dependencies</text>
    <text class="small" x="146" y="130" text-anchor="middle">consumers omit module versions</text>
  </g>

  <g transform="translate(1000,396)">
    <rect class="card" x="0" y="0" width="290" height="148" rx="20" fill="#FFF6DF" stroke="#D6A441"/>
    <text class="cardTitle" x="145" y="42" text-anchor="middle">Checked-out catalog</text>
    <text class="label" x="145" y="78" text-anchor="middle">bt4k versionCatalog</text>
    <text class="small" x="145" y="106" text-anchor="middle">producer builds use aliases</text>
    <text class="tiny" x="145" y="128" text-anchor="middle">catalog ref is date-tagged</text>
  </g>

  <g transform="translate(230,610)">
    <rect class="card" x="0" y="0" width="940" height="58" rx="18" fill="#F8FAFC" stroke="#C9D6E2"/>
    <circle cx="34" cy="29" r="9" fill="#2F6DB5"/>
    <text class="small" x="58" y="25">dependency resolution contract</text>
    <circle cx="280" cy="29" r="9" fill="#2E8B57"/>
    <text class="small" x="304" y="25">Gradle authoring contract</text>
    <circle cx="502" cy="29" r="9" fill="#65758A"/>
    <text class="small" x="526" y="25">catalog source feeds both surfaces</text>
    <text class="tiny" x="470" y="47" text-anchor="middle">Workshop and app repositories should import the published BOM, not chase catalog alias bumps.</text>
  </g>

  <path class="connector connectorSlate" d="M 414 314 H 486 Q 506 314 506 334 V 330 Q 506 350 526 350 H 530"/>
  <path class="connector connectorBlue" d="M 874 262 H 934 Q 954 262 954 242 V 225 Q 954 205 974 205 H 998"/>
  <path class="connector connectorGreen" d="M 874 428 H 934 Q 954 428 954 448 V 450 Q 954 470 974 470 H 1000"/>
  <path class="connector connectorGreen" d="M 414 348 H 470 Q 490 348 490 514 V 514 Q 490 534 510 534 H 1000"/>
</svg>
