import org.gradle.api.GradleException
import org.gradle.api.artifacts.dsl.RepositoryHandler

def candidateRepositoryPath = System.getProperty("issues242243CandidateMavenRepo")
if (!candidateRepositoryPath) {
    throw new GradleException("issues242243CandidateMavenRepo system property is required")
}
def candidateBomVersion = System.getProperty("issues242243CandidateBomVersion")
if (!candidateBomVersion) {
    throw new GradleException("issues242243CandidateBomVersion system property is required")
}
def candidateRepositoryUri = new File(candidateRepositoryPath).toURI()
def candidateBom = "io.github.bluetape4k:bluetape4k-dependencies:${candidateBomVersion}"

def addCandidateRepository = { RepositoryHandler repositories ->
    def candidateRepository = repositories.maven {
        name = "issues242243Candidate"
        url = candidateRepositoryUri
    }
    repositories.exclusiveContent {
        forRepositories(candidateRepository)
        filter {
            includeVersion(
                "io.github.bluetape4k",
                "bluetape4k-dependencies",
                candidateBomVersion,
            )
        }
    }
}

gradle.settingsEvaluated { settings ->
    addCandidateRepository(settings.dependencyResolutionManagement.repositories)
}

gradle.beforeProject { project ->
    addCandidateRepository(project.repositories)
    // Spring's dependency-management plugin imports the stable BOM as a
    // separate Maven model. Import the receipt-bound candidate after the
    // plugin is applied so its managed Timefold constraints participate in
    // candidate consumer graphs as well as Gradle platform resolution.
    project.plugins.withId("io.spring.dependency-management") {
        def dependencyManagement = project.extensions.findByName("dependencyManagement")
        if (dependencyManagement != null) {
            dependencyManagement.imports {
                mavenBom(candidateBom)
            }
        }
    }
    project.configurations.configureEach { configuration ->
        configuration.resolutionStrategy.eachDependency { details ->
            if (
                details.requested.group == "io.github.bluetape4k" &&
                    details.requested.name == "bluetape4k-dependencies"
            ) {
                details.useVersion(candidateBomVersion)
                details.because("issues #242/#243 validation must resolve the receipt-bound candidate BOM")
            }
        }
        if (configuration.name == "testImplementation") {
            project.dependencies.add(
                configuration.name,
                project.dependencies.enforcedPlatform(candidateBom),
            )
        }
    }
}
