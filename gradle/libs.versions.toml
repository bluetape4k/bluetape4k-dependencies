# @formatter:off
# Gradle Version Catalog for bluetape4k-dependencies (ecosystem BOM)

[versions]
# ── Core ecosystem ─────────────────────────────────────────────────────────
# bluetape4k-projects (monorepo core modules)
bluetape4k-core    = "1.7.0-SNAPSHOT"

# ── Independent repos ──────────────────────────────────────────────────────
# https://github.com/bluetape4k/bluetape4k-aws
bluetape4k-aws     = "0.1.0-SNAPSHOT"

# https://github.com/bluetape4k/bluetape4k-image
bluetape4k-image   = "0.1.0-SNAPSHOT"

# https://github.com/bluetape4k/bluetape4k-text
bluetape4k-text    = "0.1.0-SNAPSHOT"

# ── Build tooling ──────────────────────────────────────────────────────────
kotlin             = "2.3.21"
nmcp               = "1.4.4"
dokka              = "2.2.0"
dependency-management = "1.1.7"

# ────────────────────────────────────────────────────────────────────────────
[plugins]
kotlin-jvm            = { id = "org.jetbrains.kotlin.jvm",            version.ref = "kotlin" }
dependency-management = { id = "io.spring.dependency-management",     version.ref = "dependency-management" }
dokka                 = { id = "org.jetbrains.dokka",                  version.ref = "dokka" }
nmcp                  = { id = "com.gradleup.nmcp",                    version.ref = "nmcp" }
nmcp-aggregation      = { id = "com.gradleup.nmcp.aggregation",        version.ref = "nmcp" }

# ────────────────────────────────────────────────────────────────────────────
[libraries]
# ── bluetape4k-projects core modules ───────────────────────────────────────
bluetape4k-bom                    = { module = "io.github.bluetape4k:bluetape4k-bom",                    version.ref = "bluetape4k-core" }
bluetape4k-core                   = { module = "io.github.bluetape4k:bluetape4k-core",                   version.ref = "bluetape4k-core" }
bluetape4k-io                     = { module = "io.github.bluetape4k:bluetape4k-io",                     version.ref = "bluetape4k-core" }
bluetape4k-netty                  = { module = "io.github.bluetape4k:bluetape4k-netty",                  version.ref = "bluetape4k-core" }
bluetape4k-coroutines             = { module = "io.github.bluetape4k:bluetape4k-coroutines",             version.ref = "bluetape4k-core" }
bluetape4k-logging                = { module = "io.github.bluetape4k:bluetape4k-logging",                version.ref = "bluetape4k-core" }
bluetape4k-jackson2               = { module = "io.github.bluetape4k:bluetape4k-jackson2",               version.ref = "bluetape4k-core" }
bluetape4k-jackson3               = { module = "io.github.bluetape4k:bluetape4k-jackson3",               version.ref = "bluetape4k-core" }
bluetape4k-idgenerators           = { module = "io.github.bluetape4k:bluetape4k-idgenerators",           version.ref = "bluetape4k-core" }
bluetape4k-resilience4j           = { module = "io.github.bluetape4k:bluetape4k-resilience4j",           version.ref = "bluetape4k-core" }
bluetape4k-junit5                 = { module = "io.github.bluetape4k:bluetape4k-junit5",                 version.ref = "bluetape4k-core" }
bluetape4k-testcontainers         = { module = "io.github.bluetape4k:bluetape4k-testcontainers",         version.ref = "bluetape4k-core" }

# ── bluetape4k-aws modules ─────────────────────────────────────────────────
bluetape4k-aws                    = { module = "io.github.bluetape4k.aws:aws",                           version.ref = "bluetape4k-aws" }
bluetape4k-aws-kotlin             = { module = "io.github.bluetape4k.aws:aws-kotlin",                   version.ref = "bluetape4k-aws" }
bluetape4k-aws-spring-boot        = { module = "io.github.bluetape4k.aws:aws-spring-boot",              version.ref = "bluetape4k-aws" }
bluetape4k-aws-ktor               = { module = "io.github.bluetape4k.aws:aws-ktor",                     version.ref = "bluetape4k-aws" }

# ── bluetape4k-image modules ───────────────────────────────────────────────
bluetape4k-images                 = { module = "io.github.bluetape4k.image:images",                     version.ref = "bluetape4k-image" }
bluetape4k-images-vips-api        = { module = "io.github.bluetape4k.image:images-vips-api",            version.ref = "bluetape4k-image" }
bluetape4k-images-vips-java21     = { module = "io.github.bluetape4k.image:images-vips-java21",         version.ref = "bluetape4k-image" }
bluetape4k-images-vips-java25     = { module = "io.github.bluetape4k.image:images-vips-java25",         version.ref = "bluetape4k-image" }

# ── bluetape4k-text modules ────────────────────────────────────────────────
bluetape4k-tokenizer-core         = { module = "io.github.bluetape4k.text:tokenizer-core",              version.ref = "bluetape4k-text" }
bluetape4k-tokenizer-japanese     = { module = "io.github.bluetape4k.text:tokenizer-japanese",          version.ref = "bluetape4k-text" }
bluetape4k-tokenizer-korean       = { module = "io.github.bluetape4k.text:tokenizer-korean",            version.ref = "bluetape4k-text" }
bluetape4k-lingua                 = { module = "io.github.bluetape4k.text:lingua",                      version.ref = "bluetape4k-text" }
bluetape4k-text-search            = { module = "io.github.bluetape4k.text:text-search",                 version.ref = "bluetape4k-text" }
