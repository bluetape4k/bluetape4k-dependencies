# @formatter:off
# Gradle Version Catalog for bluetape4k-dependencies (ecosystem BOM)

[versions]
# ── Core ecosystem ─────────────────────────────────────────────────────────
# bluetape4k-projects (monorepo core modules)
bluetape4k-core    = "1.8.0-SNAPSHOT"  # https://mvnrepository.com/artifact/io.github.bluetape4k/bluetape4k-bom

# ── Independent repos ──────────────────────────────────────────────────────
# https://github.com/bluetape4k/bluetape4k-aws
bluetape4k-aws     = "0.1.0-SNAPSHOT"  # https://mvnrepository.com/artifact/io.github.bluetape4k.aws/bluetape4k-aws-bom

# https://github.com/bluetape4k/bluetape4k-image
bluetape4k-image   = "0.1.0-SNAPSHOT"  # https://mvnrepository.com/artifact/io.github.bluetape4k.image/bluetape4k-image-bom

# https://github.com/bluetape4k/bluetape4k-text
bluetape4k-text    = "0.1.0-SNAPSHOT"  # https://mvnrepository.com/artifact/io.github.bluetape4k.text/bluetape4k-text-bom

# https://github.com/bluetape4k/bluetape4k-graph
bluetape4k-graph   = "0.3.0-SNAPSHOT"  # https://mvnrepository.com/artifact/io.github.bluetape4k.graph/bluetape4k-graph-bom

# https://github.com/bluetape4k/bluetape4k-leader
bluetape4k-leader  = "0.1.0-SNAPSHOT"  # https://mvnrepository.com/artifact/io.github.bluetape4k.leader/leader-bom

# https://github.com/bluetape4k/bluetape4k-exposed
bluetape4k-exposed = "1.8.0-SNAPSHOT"  # https://mvnrepository.com/artifact/io.github.bluetape4k.exposed/bluetape4k-exposed-bom

# https://github.com/bluetape4k/bluetape4k-javers
bluetape4k-javers  = "0.1.0-SNAPSHOT"  # https://mvnrepository.com/artifact/io.github.bluetape4k.javers/bluetape4k-javers-bom

# ── Build tooling ──────────────────────────────────────────────────────────
kotlin             = "2.3.21"  # https://mvnrepository.com/artifact/org.jetbrains.kotlin/kotlin-bom
nmcp               = "1.5.0"  # https://mvnrepository.com/artifact/com.gradleup.nmcp/nmcp
dokka              = "2.2.0"  # https://mvnrepository.com/artifact/org.jetbrains.dokka/dokka-gradle-plugin
dependency-management = "1.1.7"  # https://mvnrepository.com/artifact/io.spring.gradle/dependency-management-plugin

# ────────────────────────────────────────────────────────────────────────────
[plugins]
kotlin-jvm            = { id = "org.jetbrains.kotlin.jvm",            version.ref = "kotlin" }
dependency-management = { id = "io.spring.dependency-management",     version.ref = "dependency-management" }
dokka                 = { id = "org.jetbrains.dokka",                  version.ref = "dokka" }
nmcp                  = { id = "com.gradleup.nmcp",                    version.ref = "nmcp" }
nmcp-aggregation      = { id = "com.gradleup.nmcp.aggregation",        version.ref = "nmcp" }

# ────────────────────────────────────────────────────────────────────────────
