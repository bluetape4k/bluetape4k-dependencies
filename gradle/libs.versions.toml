bluetape4k-graph-neo4j            = { module = "io.github.bluetape4k.graph:graph-neo4j",                version.ref = "bluetape4k-graph" }
bluetape4k-graph-tinkerpop        = { module = "io.github.bluetape4k.graph:graph-tinkerpop",            version.ref = "bluetape4k-graph" }
bluetape4k-graph-io-core          = { module = "io.github.bluetape4k.graph:graph-io-core",              version.ref = "bluetape4k-graph" }
bluetape4k-graph-io-csv           = { module = "io.github.bluetape4k.graph:graph-io-csv",               version.ref = "bluetape4k-graph" }
bluetape4k-graph-io-graphml       = { module = "io.github.bluetape4k.graph:graph-io-graphml",           version.ref = "bluetape4k-graph" }
bluetape4k-graph-io-jackson2      = { module = "io.github.bluetape4k.graph:graph-io-jackson2",          version.ref = "bluetape4k-graph" }
bluetape4k-graph-io-jackson3      = { module = "io.github.bluetape4k.graph:graph-io-jackson3",          version.ref = "bluetape4k-graph" }
bluetape4k-graph-io-okio          = { module = "io.github.bluetape4k.graph:graph-io-okio",              version.ref = "bluetape4k-graph" }

