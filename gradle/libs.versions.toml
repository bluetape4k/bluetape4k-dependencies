bluetape4k-leader-exposed-jdbc    = { module = "io.github.bluetape4k.leader:leader-exposed-jdbc",       version.ref = "bluetape4k-leader" }
bluetape4k-leader-exposed-r2dbc   = { module = "io.github.bluetape4k.leader:leader-exposed-r2dbc",      version.ref = "bluetape4k-leader" }
bluetape4k-leader-mongodb         = { module = "io.github.bluetape4k.leader:leader-mongodb",            version.ref = "bluetape4k-leader" }
