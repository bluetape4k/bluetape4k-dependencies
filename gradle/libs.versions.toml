bluetape4k-leader-spring-boot3    = { module = "io.github.bluetape4k.leader:leader-spring-boot3",       version.ref = "bluetape4k-leader" }
bluetape4k-leader-spring-boot4    = { module = "io.github.bluetape4k.leader:leader-spring-boot4",       version.ref = "bluetape4k-leader" }
