title = "bluetape4k-dependencies gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allowlisted paths and patterns"

paths = [
    '''.idea/''',
    '''build/''',
    '''.gradle/''',
    '''gradle/wrapper/''',
    '''src/test/resources/''',
    '''docs/''',
    '''README\.md''',
    '''README\.ko\.md''',
    '''\.bluetape/''',
    '''.worktrees/''',
    '''config/post-publish-next-development-line\.json''',
    '''tests/test_post_publish_next_development_line\.py''',
]

regexes = [
    '''YOUR_.*_HERE''',
    '''example[-_]key''',
    '''test[-_]api[-_]key''',
    '''^(?:maxmind-geoip2|jakarta-persistence-v3[12]|bouncycastle-bcprov-lts8on)$''',
]
