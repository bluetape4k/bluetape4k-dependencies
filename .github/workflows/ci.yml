name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET_URL=$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
              | jq -r '.assets[]
                  | select(.name | test("^gitleaks_[0-9.]+_linux_x64\\.tar\\.gz$"))
                  | .browser_download_url' \
              | head -n 1
          )
          test -n "$ASSET_URL"
          curl -fsSL "$ASSET_URL" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-git --config .gitleaks.toml

  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6.4.0

  build:
    name: Build BOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Record Python version
        run: python3 --version
      - name: Clone managed repositories for catalog script checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          mapfile -t repos < <(python3 scripts/verify-post-publish-next-development-line.py --print-required-repositories)
          mapfile -t snapshot_repositories < <(python3 scripts/verify-post-publish-next-development-line.py --print-snapshot-catalog-repositories)
          mapfile -t signing_refs < <(python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("config/publishing-signing-repository-refs.json").read_text(
                  encoding="utf-8"
              )
          )
          for repository, value in sorted(manifest["repositories"].items()):
              print(f"{repository}\t{value['commit']}")
          PY
          )
          declare -A signing_sha=()
          for entry in "${signing_refs[@]}"; do
            IFS=$'\t' read -r repository expected_sha <<< "$entry"
            signing_sha["$repository"]="$expected_sha"
          done
          candidate_branch=""
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${GITHUB_BASE_REF}" == "develop" ]] ||
             [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            candidate_branch=$(python3 scripts/verify-post-publish-next-development-line.py --print-snapshot-candidate-branch)
          fi
          for repo in "${repos[@]}"; do
            expected_sha="${signing_sha[$repo]:-}"
            clone_args=(--depth 1)
            if [[ -n "$expected_sha" ]]; then
              clone_args=(--filter=blob:none --no-checkout)
            fi
            selected_candidate_branch=false
            use_snapshot_candidate=false
            for snapshot_repo in "${snapshot_repositories[@]}"; do
              if [[ "$snapshot_repo" == "$repo" ]]; then
                use_snapshot_candidate=true
                break
              fi
            done
            if [[ -z "$expected_sha" && "$use_snapshot_candidate" == true && -n "$candidate_branch" ]]; then
              branch_error="$RUNNER_TEMP/snapshot-candidate-${repo}.error"
              if gh api "repos/bluetape4k/${repo}/branches/${candidate_branch}" \
                   >/dev/null 2>"$branch_error"; then
                clone_args=(--filter=blob:none --branch "$candidate_branch" --single-branch)
                selected_candidate_branch=true
              elif grep -Fq "(HTTP 404)" "$branch_error"; then
                clone_args+=(--branch develop --single-branch)
              else
                sed 's/^/snapshot candidate lookup failed: /' "$branch_error" >&2
                exit 1
              fi
            fi
            gh repo clone "bluetape4k/${repo}" "../${repo}" -- "${clone_args[@]}"
            if [[ "$selected_candidate_branch" == true ]]; then
              git -C "../${repo}" fetch --no-tags --filter=blob:none \
                origin "develop:refs/remotes/origin/develop"
            fi
            if [[ -n "$expected_sha" ]]; then
              # Keep the authenticated HTTPS remote installed by gh for the
              # immutable fetch.  The strict map gets its SSH origin only
              # after this exact object has been checked out.
              git -C "../${repo}" fetch --no-tags --filter=blob:none origin "$expected_sha"
              git -C "../${repo}" fetch --no-tags origin "develop:refs/remotes/origin/develop"
              git -C "../${repo}" checkout -B "issues-242-243-${repo}" "$expected_sha"
              peeled_sha=$(git -C "../${repo}" rev-parse --verify "${expected_sha}^{commit}")
              test "$peeled_sha" = "$expected_sha"
              test "$(git -C "../${repo}" rev-parse HEAD)" = "$expected_sha"
              test -z "$(git -C "../${repo}" status --porcelain=v1 --untracked-files=all)"
            fi
            git -C "../${repo}" remote set-url origin "git@github.com:bluetape4k/${repo}.git"
            test "$(git -C "../${repo}" remote get-url origin)" = "git@github.com:bluetape4k/${repo}.git"
          done

      - name: Fetch pinned snapshot catalog history
        if: ${{ github.ref == 'refs/heads/develop' || github.base_ref == 'develop' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE' > "$RUNNER_TEMP/snapshot-catalog-refs.txt"
          import json
          import re
          from pathlib import Path

          policy = json.loads(
              Path("config/post-publish-next-development-line.json").read_text(
                  encoding="utf-8"
              )
          )["consumer-policy"]
          refs = {
              policy["snapshot-catalog-ref"],
              *policy.get("snapshot-catalog-ref-overrides", {}).values(),
          }
          for ref in sorted(refs):
              if not re.fullmatch(r"[0-9a-f]{40}", ref):
                  raise SystemExit("snapshot catalog ref must be an immutable commit SHA")
              print(ref)
          PYCODE
          while IFS= read -r catalog_ref; do
            git fetch --no-tags "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$catalog_ref"
            test "$(git rev-parse --verify "${catalog_ref}^{commit}")" = "$catalog_ref"
          done < "$RUNNER_TEMP/snapshot-catalog-refs.txt"

      - name: Build exact catalog repository map
        shell: bash
        run: |
          set -euo pipefail
          git remote set-url origin git@github.com:bluetape4k/bluetape4k-dependencies.git
          python3 - "$GITHUB_WORKSPACE" "$RUNNER_TEMP/issues-242-243-repository-map.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "scripts"))
          import catalog_candidate

          central = Path(sys.argv[1]).resolve()
          output = Path(sys.argv[2]).resolve()
          workspace = central.parent.resolve()
          manifest = json.loads(
              (central / "config/publishing-signing-repository-refs.json").read_text(
                  encoding="utf-8"
              )
          )
          repositories = {
              key: catalog_candidate.REPOSITORY_NAMES[key]
              for key in catalog_candidate.REPOSITORY_KEYS
          }

          document = {
              "schema_version": 2,
              "central": catalog_candidate.inspect_repository_for_map(
                  "bluetape4k-dependencies", central
              ),
              "repositories": {},
          }
          for key, name in repositories.items():
              root = workspace / name
              expected = manifest["repositories"].get(name, {}).get("commit")
              document["repositories"][key] = (
                  catalog_candidate.inspect_repository_for_map(name, root, expected)
              )
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(document, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(output)
          PY

      - name: Recheck exact signing refs before sync
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r repository expected_sha; do
            root="../${repository}"
            test "$(git -C "$root" rev-parse HEAD)" = "$expected_sha"
            test "$(git -C "$root" rev-parse --verify "${expected_sha}^{commit}")" = "$expected_sha"
            test "$(git -C "$root" remote get-url origin)" = "git@github.com:bluetape4k/${repository}.git"
            test -z "$(git -C "$root" status --porcelain=v1 --untracked-files=all)"
          done < <(python3 - <<'PY'
          import json
          from pathlib import Path

          document = json.loads(
              Path("config/publishing-signing-repository-refs.json").read_text(
                  encoding="utf-8"
              )
          )
          for repository, value in sorted(document["repositories"].items()):
              print(f"{repository}\t{value['commit']}")
          PY
          )

      - name: Verify all generated signing copies
        run: |
          python3 scripts/sync-publishing-signing-support.py \
            --workspace .. \
            --repository-map "$RUNNER_TEMP/issues-242-243-repository-map.json" \
            --check --summary

      - uses: actions/setup-java@v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Compile generated signing helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/issues-242-243-repository-map.json" <<'PY'
          import concurrent.futures
          import importlib.util
          import os
          import sys
          from pathlib import Path

          map_path = Path(sys.argv[1]).resolve()
          module_path = Path.cwd() / "scripts" / "catalog_candidate.py"
          spec = importlib.util.spec_from_file_location("ci_catalog_candidate", module_path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load catalog_candidate.py")
          catalog_candidate = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = catalog_candidate
          spec.loader.exec_module(catalog_candidate)
          runner_path = Path.cwd() / "scripts" / "run-issues-242-243-validation.py"
          runner_spec = importlib.util.spec_from_file_location("ci_validation_runner", runner_path)
          if runner_spec is None or runner_spec.loader is None:
              raise SystemExit("cannot load validation runner")
          runner = importlib.util.module_from_spec(runner_spec)
          sys.modules[runner_spec.name] = runner
          runner_spec.loader.exec_module(runner)
          runner.require_disposable_hosted_environment(os.environ)
          repositories = catalog_candidate.load_repository_map_v1(
              map_path, Path.cwd().parent.resolve()
          )
          selected = [
              repository
              for repository in repositories
              if repository.name in catalog_candidate.SIGNING_REPOSITORIES
          ]

          def compile_helper(repository):
              environment = runner.sanitized_environment(os.environ)
              environment["GRADLE_OPTS"] = "-Dorg.gradle.daemon=false"
              gradle_home = (
                  Path(os.environ["RUNNER_TEMP"])
                  / "signing-gradle-homes"
                  / repository.name
              )
              gradle_home.mkdir(parents=True, mode=0o700)
              os.chmod(gradle_home, 0o700)
              environment["GRADLE_USER_HOME"] = str(gradle_home)
              result = runner.run_command(
                  command=(
                      str(repository.root / "gradlew"),
                      "-p",
                      "buildSrc",
                      "compileKotlin",
                      "test",
                      "--tests",
                      "PublishingSigningSupportTest",
                      "--no-daemon",
                      "--no-configuration-cache",
                      "--no-build-cache",
                      "--console=plain",
                  ),
                  cwd=repository.root,
                  environment=environment,
                  timeout_seconds=600,
              )
              if result.status != "pass":
                  raise RuntimeError(
                      f"buildSrc validation failed for {repository.name}: "
                      f"status={result.status}, exit={result.returncode}"
                  )
              return repository.name

          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as executor:
              futures = [executor.submit(compile_helper, repository) for repository in selected]
              for future in concurrent.futures.as_completed(futures):
                  print(f"validated={future.result()}")
          PY

      - name: Clone development verification repositories
        if: ${{ github.ref == 'refs/heads/develop' || github.base_ref == 'develop' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          repos=$(python3 scripts/verify-post-publish-next-development-line.py --print-required-repositories)
          snapshot_repositories=$(python3 scripts/verify-post-publish-next-development-line.py --print-snapshot-catalog-repositories)
          candidate_branch=$(python3 scripts/verify-post-publish-next-development-line.py --print-snapshot-candidate-branch)
          mkdir -p "$RUNNER_TEMP/development-workspace"
          for repo in $repos; do
            clone_args=(--depth 1)
            use_snapshot_candidate=false
            for snapshot_repo in $snapshot_repositories; do
              if [[ "$snapshot_repo" == "$repo" ]]; then
                use_snapshot_candidate=true
                break
              fi
            done
            if [[ "$use_snapshot_candidate" == true ]]; then
              branch_error="$RUNNER_TEMP/development-candidate-${repo}.error"
              if gh api "repos/bluetape4k/${repo}/branches/${candidate_branch}" \
                   >/dev/null 2>"$branch_error"; then
                clone_args+=(--branch "$candidate_branch" --single-branch)
              elif grep -Fq "(HTTP 404)" "$branch_error"; then
                clone_args+=(--branch develop --single-branch)
              else
                sed 's/^/snapshot candidate lookup failed: /' "$branch_error" >&2
                exit 1
              fi
            fi
            gh repo clone "bluetape4k/${repo}" "$RUNNER_TEMP/development-workspace/${repo}" -- "${clone_args[@]}"
          done

      - name: Clone catalog publisher candidates
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_LFS_SKIP_SMUDGE: "1"
        run: bash scripts/checkout-catalog-publishers.sh "$RUNNER_TEMP/catalog-workspace"

      - name: Verify Detekt/Kotlin consumer canaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-detekt-kotlin-compatibility.py \
            --workspace "$RUNNER_TEMP/development-workspace" \
            --catalog "$GITHUB_WORKSPACE/gradle/libs.versions.toml" \
            --timeout 300 \
            --max-concurrency 4 \
            --run-gradle --json \
            | tee "$RUNNER_TEMP/detekt-kotlin-compatibility.json"

      - name: Validate Detekt/Kotlin canary receipt
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/detekt-kotlin-compatibility.json"
          python3 - "$RUNNER_TEMP/detekt-kotlin-compatibility.json" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if report.get("schema_version") != 1 or report.get("run_gradle") is not True:
              raise SystemExit("invalid Detekt/Kotlin canary receipt schema")
          for field in ("catalog_head_sha", "catalog_sha256", "manifest_sha256"):
              value = report.get(field)
              pattern = r"[0-9a-f]{40}" if field == "catalog_head_sha" else r"[0-9a-f]{64}"
              if not isinstance(value, str) or not re.fullmatch(pattern, value):
                  raise SystemExit(f"invalid canary provenance field: {field}")
          results = report.get("results")
          if not isinstance(results, list) or report.get("consumer_count") != len(results):
              raise SystemExit("canary consumer count does not match results")
          if report.get("failed_repositories") or report.get("passed_count") != len(results):
              raise SystemExit("Detekt/Kotlin canary receipt reports failed consumers")
          for result in results:
              if not re.fullmatch(r"[0-9a-f]{40}", result.get("head_sha", "")):
                  raise SystemExit("canary consumer HEAD provenance is missing")
              if result.get("static", {}).get("status") != "passed":
                  raise SystemExit("canary static inventory is not green")
              if result.get("probe", {}).get("status") != "passed":
                  raise SystemExit("canary Gradle probe is not green")
          PY

      - name: Upload Detekt/Kotlin consumer canary
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: detekt-kotlin-compatibility-canary
          path: ${{ runner.temp }}/detekt-kotlin-compatibility.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: Fetch pinned snapshot catalog history
        run: |
          set -euo pipefail
          python3 - <<'PYCODE' > "$RUNNER_TEMP/snapshot-catalog-refs.txt"
          import json
          import re
          from pathlib import Path
          policy = json.loads(Path("config/post-publish-next-development-line.json").read_text())["consumer-policy"]
          refs = {policy["snapshot-catalog-ref"], *policy.get("snapshot-catalog-ref-overrides", {}).values()}
          for ref in sorted(refs):
              if not re.fullmatch(r"[0-9a-f]{40}", ref):
                  raise SystemExit("snapshot catalog ref must be an immutable commit SHA")
              print(ref)
          PYCODE
          while IFS= read -r catalog_ref; do
            git fetch --no-tags "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$catalog_ref"
            git rev-parse --verify "${catalog_ref}^{commit}"
          done < "$RUNNER_TEMP/snapshot-catalog-refs.txt"

      - name: Verify catalog scripts
        run: |
          python3 -m py_compile scripts/audit-latest-stable.py scripts/write-snapshot-consumer-inputs.py scripts/sync-managed-catalog.py scripts/sync-shared-versions.py scripts/sync-dependabot-ignores.py scripts/sync-publishing-signing-support.py scripts/verify-detekt-kotlin-compatibility.py scripts/verify-latest-stable-resolved-graphs.py scripts/verify-managed-artifacts.py scripts/verify-post-publish-next-development-line.py scripts/verify-publication-poms.py scripts/verify-supply-chain-reports.py tests/*.py
          python3 -m unittest \
            tests/test_sync_publishing_signing_support.py \
            tests/test_run_issues_242_243_validation.py \
            tests/test_ci_catalog_governance.py \
            tests/test_publishing_signing_smoke.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          scripts/audit-latest-stable.py --check --summary --check-audit --audit-summary
          scripts/sync-managed-catalog.py --workspace-root "$RUNNER_TEMP/catalog-workspace" --check --summary
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${GITHUB_BASE_REF}" == "main" ]]; then
            scripts/verify-managed-artifacts.py --summary
          else
            scripts/verify-managed-artifacts.py --summary --allow-snapshots
          fi
          if [[ "${GITHUB_REF}" == "refs/heads/develop" || "${GITHUB_BASE_REF:-}" == "develop" ]]; then
            python3 scripts/verify-post-publish-next-development-line.py --summary --workspace "$RUNNER_TEMP/development-workspace"
          fi

      - name: Verify PR-safe catalog adoption guard
        if: ${{ github.event_name == 'pull_request' }}
        run: scripts/sync-shared-versions.py --workspace tests/fixtures/catalog-adoption-clean --repo bluetape4k-projects --check --summary

      - name: Verify downstream repository sync
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          projects_authority_catalog="../bluetape4k-projects/gradle/libs.project.versions.toml"
          if [[ -f "$projects_authority_catalog" ]]; then
            mapfile -t repositories < <(scripts/sync-shared-versions.py --print-default-repositories)
            other_repository_args=()
            for repository in "${repositories[@]}"; do
              if [[ "$repository" != "bluetape4k-projects" ]]; then
                other_repository_args+=(--repo "$repository")
              fi
            done
            scripts/sync-shared-versions.py --workspace .. "${other_repository_args[@]}" --check --summary
            scripts/sync-shared-versions.py --workspace .. --repo bluetape4k-projects --catalog-filename libs.project.versions.toml --check --summary
          else
            scripts/sync-shared-versions.py --workspace .. --check --summary
          fi
          scripts/sync-dependabot-ignores.py --workspace .. --check --summary
      - name: Build BOM
        run: ./gradlew build
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Write snapshot consumer input manifest
        if: ${{ github.ref == 'refs/heads/develop' }}
        run: |
          set -euo pipefail
          python3 scripts/write-snapshot-consumer-inputs.py write \
            --workspace "$RUNNER_TEMP/development-workspace" \
            --central-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/snapshot-consumer-inputs/snapshot-consumer-inputs.json" \
            --source-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload snapshot consumer input manifest
        if: ${{ github.ref == 'refs/heads/develop' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: snapshot-consumer-inputs
          path: ${{ runner.temp }}/snapshot-consumer-inputs/snapshot-consumer-inputs.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  dependabot-catalog-python:
    name: Dependabot Catalog Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and test catalog generator
        run: |
          python -m py_compile scripts/project-dependabot-catalog.py tests/test_project_dependabot_catalog.py
          python -m unittest tests.test_project_dependabot_catalog

  dependabot-catalog-parser:
    name: Dependabot Gradle Parser Contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Read pinned Dependabot Core commit
        id: dependabot-pin
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path

          mapping = tomllib.loads(
              Path("config/projects-dependabot-catalog.toml").read_text(encoding="utf-8")
          )
          commit = mapping.get("dependabot_core_commit")
          if not isinstance(commit, str) or len(commit) != 40 or any(c not in "0123456789abcdef" for c in commit):
              raise SystemExit("Dependabot Core pin must be a full lowercase commit SHA")
          print(f"commit={commit}")
          PY
      - uses: actions/checkout@v7
        with:
          repository: dependabot/dependabot-core
          ref: ${{ steps.dependabot-pin.outputs.commit }}
          path: dependabot-core
          fetch-depth: 1
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1
        with:
          working-directory: dependabot-core
          bundler-cache: true
      - name: Run pinned Gradle parser contract
        working-directory: dependabot-core
        env:
          DEPENDABOT_CORE_ROOT: ${{ github.workspace }}/dependabot-core
          MAPPING_PATH: ${{ github.workspace }}/config/projects-dependabot-catalog.toml
          GENERATED_CATALOG_PATH: ${{ github.workspace }}/tests/fixtures/project-dependabot-catalog/generated.versions.toml
          OUTPUT_PATH: ${{ runner.temp }}/dependabot-parser-receipt.json
        run: |
          set -euo pipefail
          test "$(git -C "$DEPENDABOT_CORE_ROOT" rev-parse HEAD)" = "${{ steps.dependabot-pin.outputs.commit }}"
          bundle exec ruby "$GITHUB_WORKSPACE/tests/fixtures/project-dependabot-catalog/dependabot-parser-contract.rb"

  publication-pom-contract:
    name: Cross-repository Publication POM Contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate-wrapper
    # Pull requests and manual runs establish the cross-repository contract.
    # The merged develop/main push has already passed the exact PR head, so
    # rerunning every publisher here only duplicates the critical path.
    if: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Record Python version
        run: python3 --version
      - name: Clone publisher repositories
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_LFS_SKIP_SMUDGE: "1"
        run: bash scripts/checkout-catalog-publishers.sh "$RUNNER_TEMP/catalog-workspace"
      - uses: actions/setup-java@v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Generate and validate publication POMs
        run: scripts/verify-publication-poms.py --workspace "$RUNNER_TEMP/catalog-workspace" --summary

  supply-chain-report-only:
    name: Supply-chain Report (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Record Python version
        run: python3 --version
      - name: Validate normalized supply-chain evidence
        run: python3 scripts/verify-supply-chain-reports.py --summary

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - gitleaks
      - build
      - dependabot-catalog-python
      - dependabot-catalog-parser
      - publication-pom-contract
      - supply-chain-report-only
    if: always()
    steps:
      - name: Check all jobs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLICATION_POM_RESULT: ${{ needs.publication-pom-contract.result }}
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed"
            exit 1
          fi
          if [[ "$EVENT_NAME" != "push" && "$PUBLICATION_POM_RESULT" != "success" ]]; then
            echo "Cross-repository Publication POM Contract is required for $EVENT_NAME (result=$PUBLICATION_POM_RESULT)"
            exit 1
          fi
          echo "CI passed"
