name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET_URL=$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
              | jq -r '.assets[]
                  | select(.name | test("^gitleaks_[0-9.]+_linux_x64\\.tar\\.gz$"))
                  | .browser_download_url' \
              | head -n 1
          )
          test -n "$ASSET_URL"
          curl -fsSL "$ASSET_URL" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-git --config .gitleaks.toml

  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

  build:
    name: Build BOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v7
      - name: Clone managed repositories for catalog script checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          mapfile -t repos < <(scripts/sync-shared-versions.py --print-default-repositories)
          for repo in "${repos[@]}"; do
            gh repo clone "bluetape4k/${repo}" "../${repo}" -- --depth 1
          done
      - name: Verify catalog scripts
        run: |
          python3 -m py_compile scripts/sync-managed-catalog.py scripts/sync-shared-versions.py scripts/sync-dependabot-ignores.py scripts/verify-managed-artifacts.py scripts/verify-publication-poms.py tests/*.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          scripts/sync-managed-catalog.py --check --summary
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${GITHUB_BASE_REF}" == "main" ]]; then
            scripts/verify-managed-artifacts.py --summary
          else
            scripts/verify-managed-artifacts.py --summary --allow-snapshots
          fi

      - name: Verify PR-safe catalog adoption guard
        if: ${{ github.event_name == 'pull_request' }}
        run: scripts/sync-shared-versions.py --workspace tests/fixtures/catalog-adoption-clean --repo bluetape4k-projects --check --summary

      - name: Verify downstream repository sync
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          scripts/sync-shared-versions.py --workspace .. --check --summary
          scripts/sync-dependabot-ignores.py --workspace .. --check --summary
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build BOM
        run: ./gradlew build
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

  publication-pom-contract:
    name: Cross-repository Publication POM Contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v7
      - name: Clone publisher repositories
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          mapfile -t repos < <(scripts/verify-publication-poms.py --print-default-repositories)
          for repo in "${repos[@]}"; do
            gh repo clone "bluetape4k/${repo}" "../${repo}" -- --depth 1
          done
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Generate and validate publication POMs
        run: scripts/verify-publication-poms.py --workspace .. --summary

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - gitleaks
      - build
      - publication-pom-contract
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
