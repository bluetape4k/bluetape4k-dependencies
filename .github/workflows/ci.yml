name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET_URL=$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
              | jq -r '.assets[]
                  | select(.name | test("^gitleaks_[0-9.]+_linux_x64\\.tar\\.gz$"))
                  | .browser_download_url' \
              | head -n 1
          )
          test -n "$ASSET_URL"
          curl -fsSL "$ASSET_URL" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-git --config .gitleaks.toml

  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6.3.0

  build:
    name: Build BOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Clone managed repositories for catalog script checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          mapfile -t repos < <(python3 scripts/verify-post-publish-next-development-line.py --print-required-repositories)
          mapfile -t snapshot_repositories < <(python3 scripts/verify-post-publish-next-development-line.py --print-snapshot-catalog-repositories)
          mapfile -t signing_refs < <(python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("config/publishing-signing-repository-refs.json").read_text(
                  encoding="utf-8"
              )
          )
          for repository, value in sorted(manifest["repositories"].items()):
              print(f"{repository}\t{value['commit']}")
          PY
          )
          declare -A signing_sha=()
          for entry in "${signing_refs[@]}"; do
            IFS=$'\t' read -r repository expected_sha <<< "$entry"
            signing_sha["$repository"]="$expected_sha"
          done
          candidate_branch=""
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${GITHUB_BASE_REF}" == "develop" ]] ||
             [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            candidate_branch=$(python3 scripts/verify-post-publish-next-development-line.py --print-snapshot-candidate-branch)
          fi
          for repo in "${repos[@]}"; do
            expected_sha="${signing_sha[$repo]:-}"
            clone_args=(--depth 1)
            if [[ -n "$expected_sha" ]]; then
              clone_args=(--filter=blob:none --no-checkout)
            fi
            selected_candidate_branch=false
            use_snapshot_candidate=false
            for snapshot_repo in "${snapshot_repositories[@]}"; do
              if [[ "$snapshot_repo" == "$repo" ]]; then
                use_snapshot_candidate=true
                break
              fi
            done
            if [[ -z "$expected_sha" && "$use_snapshot_candidate" == true && -n "$candidate_branch" ]]; then
              branch_error="$RUNNER_TEMP/snapshot-candidate-${repo}.error"
              if gh api "repos/bluetape4k/${repo}/branches/${candidate_branch}" \
                   >/dev/null 2>"$branch_error"; then
                clone_args=(--filter=blob:none --branch "$candidate_branch" --single-branch)
                selected_candidate_branch=true
              elif grep -Fq "(HTTP 404)" "$branch_error"; then
                clone_args+=(--branch develop --single-branch)
              else
                sed 's/^/snapshot candidate lookup failed: /' "$branch_error" >&2
                exit 1
              fi
            fi
            gh repo clone "bluetape4k/${repo}" "../${repo}" -- "${clone_args[@]}"
            if [[ "$selected_candidate_branch" == true ]]; then
              git -C "../${repo}" fetch --no-tags --filter=blob:none \
                origin "develop:refs/remotes/origin/develop"
            fi
            if [[ -n "$expected_sha" ]]; then
              # Keep the authenticated HTTPS remote installed by gh for the
              # immutable fetch.  The strict map gets its SSH origin only
              # after this exact object has been checked out.
              git -C "../${repo}" fetch --no-tags --filter=blob:none origin "$expected_sha"
              git -C "../${repo}" fetch --no-tags origin "develop:refs/remotes/origin/develop"
              git -C "../${repo}" checkout -B "issues-242-243-${repo}" "$expected_sha"
              peeled_sha=$(git -C "../${repo}" rev-parse --verify "${expected_sha}^{commit}")
              test "$peeled_sha" = "$expected_sha"
              test "$(git -C "../${repo}" rev-parse HEAD)" = "$expected_sha"
              test -z "$(git -C "../${repo}" status --porcelain=v1 --untracked-files=all)"
            fi
            git -C "../${repo}" remote set-url origin "git@github.com:bluetape4k/${repo}.git"
            test "$(git -C "../${repo}" remote get-url origin)" = "git@github.com:bluetape4k/${repo}.git"
          done

      - name: Build exact catalog repository map
        shell: bash
        run: |
          set -euo pipefail
          git remote set-url origin git@github.com:bluetape4k/bluetape4k-dependencies.git
          python3 - "$GITHUB_WORKSPACE" "$RUNNER_TEMP/issues-242-243-repository-map.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "scripts"))
          import catalog_candidate

          central = Path(sys.argv[1]).resolve()
          output = Path(sys.argv[2]).resolve()
          workspace = central.parent.resolve()
          manifest = json.loads(
              (central / "config/publishing-signing-repository-refs.json").read_text(
                  encoding="utf-8"
              )
          )
          repositories = {
              key: catalog_candidate.REPOSITORY_NAMES[key]
              for key in catalog_candidate.REPOSITORY_KEYS
          }

          document = {
              "schema_version": 1,
              "central": catalog_candidate.inspect_repository_for_map(
                  "bluetape4k-dependencies", central
              ),
              "repositories": {},
          }
          for key, name in repositories.items():
              root = workspace / name
              expected = manifest["repositories"].get(name, {}).get("commit")
              document["repositories"][key] = (
                  catalog_candidate.inspect_repository_for_map(name, root, expected)
              )
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(document, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(output)
          PY

      - name: Recheck exact signing refs before sync
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r repository expected_sha; do
            root="../${repository}"
            test "$(git -C "$root" rev-parse HEAD)" = "$expected_sha"
            test "$(git -C "$root" rev-parse --verify "${expected_sha}^{commit}")" = "$expected_sha"
            test "$(git -C "$root" remote get-url origin)" = "git@github.com:bluetape4k/${repository}.git"
            test -z "$(git -C "$root" status --porcelain=v1 --untracked-files=all)"
          done < <(python3 - <<'PY'
          import json
          from pathlib import Path

          document = json.loads(
              Path("config/publishing-signing-repository-refs.json").read_text(
                  encoding="utf-8"
              )
          )
          for repository, value in sorted(document["repositories"].items()):
              print(f"{repository}\t{value['commit']}")
          PY
          )

      - name: Verify all generated signing copies
        run: |
          python3 scripts/sync-publishing-signing-support.py \
            --workspace .. \
            --repository-map "$RUNNER_TEMP/issues-242-243-repository-map.json" \
            --check --summary

      - uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Compile generated signing helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/issues-242-243-repository-map.json" <<'PY'
          import concurrent.futures
          import importlib.util
          import os
          import sys
          from pathlib import Path

          map_path = Path(sys.argv[1]).resolve()
          module_path = Path.cwd() / "scripts" / "catalog_candidate.py"
          spec = importlib.util.spec_from_file_location("ci_catalog_candidate", module_path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load catalog_candidate.py")
          catalog_candidate = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = catalog_candidate
          spec.loader.exec_module(catalog_candidate)
          runner_path = Path.cwd() / "scripts" / "run-issues-242-243-validation.py"
          runner_spec = importlib.util.spec_from_file_location("ci_validation_runner", runner_path)
          if runner_spec is None or runner_spec.loader is None:
              raise SystemExit("cannot load validation runner")
          runner = importlib.util.module_from_spec(runner_spec)
          sys.modules[runner_spec.name] = runner
          runner_spec.loader.exec_module(runner)
          repositories = catalog_candidate.load_repository_map_v1(
              map_path, Path.cwd().parent.resolve()
          )
          selected = [
              repository
              for repository in repositories
              if repository.name in catalog_candidate.SIGNING_REPOSITORIES
          ]

          def compile_helper(repository):
              environment = runner.sanitized_environment(os.environ)
              environment["GRADLE_OPTS"] = "-Dorg.gradle.daemon=false"
              gradle_home = (
                  Path(os.environ["RUNNER_TEMP"])
                  / "signing-gradle-homes"
                  / repository.name
              )
              gradle_home.mkdir(parents=True, mode=0o700)
              os.chmod(gradle_home, 0o700)
              environment["GRADLE_USER_HOME"] = str(gradle_home)
              result = runner.run_command(
                  command=(
                      str(repository.root / "gradlew"),
                      "-p",
                      "buildSrc",
                      "compileKotlin",
                      "test",
                      "--tests",
                      "PublishingSigningSupportTest",
                      "--no-daemon",
                      "--no-configuration-cache",
                      "--no-build-cache",
                      "--console=plain",
                  ),
                  cwd=repository.root,
                  environment=environment,
                  timeout_seconds=600,
              )
              if result.status != "pass":
                  raise RuntimeError(
                      f"buildSrc validation failed for {repository.name}: "
                      f"status={result.status}, exit={result.returncode}"
                  )
              return repository.name

          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as executor:
              futures = [executor.submit(compile_helper, repository) for repository in selected]
              for future in concurrent.futures.as_completed(futures):
                  print(f"validated={future.result()}")
          PY

      - name: Verify catalog scripts
        run: |
          python3 -m py_compile scripts/audit-latest-stable.py scripts/sync-managed-catalog.py scripts/sync-shared-versions.py scripts/sync-dependabot-ignores.py scripts/sync-publishing-signing-support.py scripts/verify-latest-stable-resolved-graphs.py scripts/verify-managed-artifacts.py scripts/verify-post-publish-next-development-line.py scripts/verify-publication-poms.py scripts/verify-supply-chain-reports.py tests/*.py
          python3 -m unittest \
            tests/test_sync_publishing_signing_support.py \
            tests/test_run_issues_242_243_validation.py \
            tests/test_ci_catalog_governance.py \
            tests/test_publishing_signing_smoke.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          scripts/audit-latest-stable.py --check --summary --check-audit --audit-summary
          scripts/sync-managed-catalog.py --check --summary
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${GITHUB_BASE_REF}" == "main" ]]; then
            scripts/verify-managed-artifacts.py --summary
          else
            scripts/verify-managed-artifacts.py --summary --allow-snapshots
          fi
          if [[ "${GITHUB_REF}" == "refs/heads/develop" || "${GITHUB_BASE_REF:-}" == "develop" ]]; then
            python3 scripts/verify-post-publish-next-development-line.py --summary
          fi

      - name: Verify PR-safe catalog adoption guard
        if: ${{ github.event_name == 'pull_request' }}
        run: scripts/sync-shared-versions.py --workspace tests/fixtures/catalog-adoption-clean --repo bluetape4k-projects --check --summary

      - name: Verify downstream repository sync
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          scripts/sync-shared-versions.py --workspace .. --check --summary
          scripts/sync-dependabot-ignores.py --workspace .. --check --summary
      - name: Build BOM
        run: ./gradlew build
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

  publication-pom-contract:
    name: Cross-repository Publication POM Contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate-wrapper
    # Pull requests and manual runs establish the cross-repository contract.
    # The merged develop/main push has already passed the exact PR head, so
    # rerunning every publisher here only duplicates the critical path.
    if: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@v7
      - name: Clone publisher repositories
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          mapfile -t repos < <(scripts/verify-publication-poms.py --print-default-repositories)
          for repo in "${repos[@]}"; do
            gh repo clone "bluetape4k/${repo}" "../${repo}" -- --depth 1
          done
      - uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Generate and validate publication POMs
        run: scripts/verify-publication-poms.py --workspace .. --summary

  supply-chain-report-only:
    name: Supply-chain Report (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate normalized supply-chain evidence
        run: python3 scripts/verify-supply-chain-reports.py --summary

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - gitleaks
      - build
      - publication-pom-contract
      - supply-chain-report-only
    if: always()
    steps:
      - name: Check all jobs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLICATION_POM_RESULT: ${{ needs.publication-pom-contract.result }}
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed"
            exit 1
          fi
          if [[ "$EVENT_NAME" != "push" && "$PUBLICATION_POM_RESULT" != "success" ]]; then
            echo "Cross-repository Publication POM Contract is required for $EVENT_NAME (result=$PUBLICATION_POM_RESULT)"
            exit 1
          fi
          echo "CI passed"
