name: Publish Snapshot

permissions:
  actions: read
  contents: read

on:
  workflow_run:
    workflows: ["CI"]
    branches: [develop]
    types: [completed]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "재사용할 성공한 CI workflow run ID"
        required: true
        type: string

concurrency:
  group: publish-snapshot
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    name: Publish SNAPSHOT to Maven Central
    runs-on: ubuntu-latest
    environment: maven-central-release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Download CI consumer input manifest
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: snapshot-consumer-inputs
          path: ${{ runner.temp }}/snapshot-consumer-inputs
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.ci_run_id }}

      - name: Verify and checkout exact CI source commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.ci_run_id }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/snapshot-consumer-inputs/snapshot-consumer-inputs.json"
          source_commit=$(python3 scripts/write-snapshot-consumer-inputs.py source-commit --manifest "$manifest")
          source_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")
          echo "$source_run" \
            | jq -e --arg expected_sha "$source_commit" \
              '(.name == "CI") and (.head_branch == "develop") and
               (.status == "completed") and (.conclusion == "success") and
               (.head_sha == $expected_sha)' >/dev/null
          source_attempt=$(jq -er '.run_attempt | tostring' <<<"$source_run")
          if [[ -n "$EXPECTED_WORKFLOW_HEAD_SHA" && "$source_commit" != "$EXPECTED_WORKFLOW_HEAD_SHA" ]]; then
            echo "snapshot manifest source $source_commit must match workflow_run head $EXPECTED_WORKFLOW_HEAD_SHA" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$source_commit" ]]; then
            git fetch --no-tags origin "$source_commit"
            git checkout --detach "$source_commit"
          fi
          test "$(git rev-parse HEAD)" = "$source_commit"
          python3 scripts/write-snapshot-consumer-inputs.py validate \
            --manifest "$manifest" \
            --expected-source-commit "$source_commit" \
            --expected-workflow-run-id "$SOURCE_RUN_ID" \
            --expected-workflow-attempt "$source_attempt"

      - name: Fetch pinned snapshot catalog history
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE' > "$RUNNER_TEMP/snapshot-catalog-refs.txt"
          import json
          import re
          from pathlib import Path

          policy = json.loads(
              Path("config/post-publish-next-development-line.json").read_text()
          )["consumer-policy"]
          refs = {
              policy["snapshot-catalog-ref"],
              *policy.get("snapshot-catalog-ref-overrides", {}).values(),
          }
          for ref in sorted(refs):
              if not re.fullmatch(r"[0-9a-f]{40}", ref):
                  raise SystemExit("snapshot catalog ref must be an immutable commit SHA")
              print(ref)
          PYCODE
          while IFS= read -r catalog_ref; do
            git fetch --no-tags "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$catalog_ref"
            git rev-parse --verify "${catalog_ref}^{commit}"
          done < "$RUNNER_TEMP/snapshot-catalog-refs.txt"

      - name: Checkout exact CI consumer inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          bash scripts/checkout-snapshot-consumers.sh \
            "$RUNNER_TEMP/snapshot-consumer-workspace" \
            "$RUNNER_TEMP/snapshot-consumer-inputs/snapshot-consumer-inputs.json"

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Verify next development line preflight
        run: python3 scripts/verify-post-publish-next-development-line.py --summary --workspace "$RUNNER_TEMP/snapshot-consumer-workspace"

      - name: Publish SNAPSHOT
        run: ./gradlew publishAllPublicationsToCentralSnapshots -PsnapshotVersion=-SNAPSHOT --no-daemon --no-configuration-cache --no-build-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

      - name: Verify published snapshot metadata
        run: python3 scripts/verify-post-publish-next-development-line.py --summary --require-artifacts --workspace "$RUNNER_TEMP/snapshot-consumer-workspace"

      - name: Generate run-scoped supply-chain report-only evidence
        shell: bash
        run: |
          set -euo pipefail
          report_train="$(date -u +%Y-%m-%d)-publish-snapshot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 scripts/generate-supply-chain-report.py --train "$report_train"
          python3 scripts/verify-supply-chain-reports.py --report build/supply-chain-report/supply-chain-report-only.json --summary
          cat build/supply-chain-report/supply-chain-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload supply-chain report-only evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supply-chain-report-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/supply-chain-report/
          if-no-files-found: error
          retention-days: 90
