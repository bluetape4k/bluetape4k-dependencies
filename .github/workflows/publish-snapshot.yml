name: Publish Snapshot

permissions:
  contents: read

on:
  workflow_run:
    workflows: ["CI"]
    branches: [develop]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: publish-snapshot
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    name: Publish SNAPSHOT to Maven Central
    runs-on: ubuntu-latest
    environment: maven-central-release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Clone snapshot libraries and official-release examples
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          mapfile -t repos < <(python3 scripts/verify-post-publish-next-development-line.py --print-required-repositories)
          for repo in "${repos[@]}"; do
            gh repo clone "bluetape4k/${repo}" "../${repo}" -- --depth 1
          done

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Verify next development line preflight
        run: python3 scripts/verify-post-publish-next-development-line.py --summary

      - name: Publish SNAPSHOT
        run: ./gradlew publishAllPublicationsToCentralSnapshots -PsnapshotVersion=-SNAPSHOT --no-daemon --no-configuration-cache --no-build-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

      - name: Verify published snapshot metadata
        run: python3 scripts/verify-post-publish-next-development-line.py --summary --require-artifacts

      - name: Generate run-scoped supply-chain report-only evidence
        shell: bash
        run: |
          set -euo pipefail
          report_train="$(date -u +%Y-%m-%d)-publish-snapshot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 scripts/generate-supply-chain-report.py --train "$report_train"
          python3 scripts/verify-supply-chain-reports.py --report build/supply-chain-report/supply-chain-report-only.json --summary
          cat build/supply-chain-report/supply-chain-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload supply-chain report-only evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supply-chain-report-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/supply-chain-report/
          if-no-files-found: error
          retention-days: 90
